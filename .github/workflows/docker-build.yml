name: Docker Build & Push

on:
  push:
    branches: [main, dev]

permissions:
  contents: read
  packages: write

env:
  IMAGE: ghcr.io/aerostacks/tusd-custom

jobs:
  build:
    runs-on: [self-hosted, r2d2]
    steps:
      - uses: actions/checkout@v4

      - name: Log in to GHCR
        run: echo "${{ secrets.GHCR_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin

      - name: Build and push
        run: |
          BRANCH="${GITHUB_REF##*/}"
          DOCKER_BUILDKIT=1 docker build -t "${IMAGE}:${BRANCH}" .
          docker push "${IMAGE}:${BRANCH}"

  deploy:
    needs: build
    if: github.ref == 'refs/heads/main' && !contains(github.event.head_commit.message, '[skip deploy]')
    runs-on: [self-hosted, r2d2]
    steps:
      - name: Deploy
        run: |
          docker pull ${IMAGE}:main
          docker run --rm -v /var/run/docker.sock:/var/run/docker.sock \
            -v /home/r2d2/unified:/home/r2d2/unified \
            -w /home/r2d2/unified docker:cli \
            compose -f docker-compose.data.yml up -d tusd_missiondata
